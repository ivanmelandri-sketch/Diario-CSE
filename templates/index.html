<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diario di Bordo CSE</title>
    <!-- Importiamo un font arrotondato e accogliente -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            /* Sfondo pergamena antica con texture di carta mossa e vignettatura calda */
            background-color: #f2e3c6;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(255, 248, 230, 0.7) 0%, rgba(210, 185, 140, 0.8) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
            font-family: 'Quicksand', sans-serif;
            color: #3b2f2f;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px dashed #b59b75;
            padding-bottom: 15px;
        }
        h1 {
            font-size: 1.8rem;
            color: #4a3319;
            margin: 0;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 1px rgba(255,255,255,0.4);
        }
        p.subtitle {
            color: #735a3d;
            font-size: 0.95rem;
            margin-top: 5px;
        }
        /* Stile Foglio di Quaderno Antico */
        .note-card {
            background: #fffdf5;
            border: 1px solid #d4be9d;
            border-left: 6px solid #8c6d46; /* Margine rilegatura */
            border-radius: 4px;
            padding: 22px;
            margin-bottom: 22px;
            box-shadow: 0 6px 16px rgba(60, 40, 20, 0.12);
            position: relative;
        }
        .note-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #8c7355;
            border-bottom: 1px solid #f2ead8;
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .note-body {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #2b2118;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Diario di Bordo CSE</h1>
            <p class="subtitle">Quaderno digitale delle attività e delle note di équipe</p>
        </header>

        <div class="timeline">
            {% for note in notes %}
            <div class="note-card">
                <div class="note-header">
                    <span>👤 {{ note.operatore }}</span>
                    <span>🕒 {{ note.data }}</span>
                </div>
                <div class="note-body">
                    {{ note.testo }}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
